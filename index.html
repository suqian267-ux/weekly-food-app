<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#315c48"><meta name="description" content="一周菜单、做法与采购清单"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon.svg"><title>一周好好吃饭</title><style>
:root{--green:#315c48;--pale:#edf3ed;--ink:#24332b;--muted:#708077;--line:#e3e9e4}*{box-sizing:border-box}body{margin:0;background:#f5f7f4;color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans SC",sans-serif;padding-bottom:78px}.top{background:var(--green);color:white;padding:25px 20px 22px;border-radius:0 0 24px 24px}.top small{opacity:.8}.top h1{font-size:25px;margin:8px 0}.top p{margin:0;font-size:13px;opacity:.85}.wrap{max-width:720px;margin:auto;padding:16px}.tabs{display:flex;gap:8px;overflow:auto;margin:2px 0 16px}.tab{border:0;border-radius:20px;padding:9px 15px;background:white;color:var(--muted);white-space:nowrap}.tab.active{background:var(--green);color:white}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 3px 14px #1d3c2410}.day{font-size:12px;color:var(--green);font-weight:700}.dish{font-size:19px;font-weight:750;margin:5px 0}.tag{font-size:12px;color:var(--muted)}h2{font-size:17px;margin:20px 2px 8px}.section{display:none}.section.active{display:block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.mini{background:var(--pale);border-radius:12px;padding:12px;font-size:13px}.mini b{display:block;font-size:17px;color:var(--green)}ul{padding-left:20px;line-height:1.8;font-size:14px}ol{padding-left:22px;line-height:1.9;font-size:14px}.check{display:flex;align-items:center;gap:10px;padding:10px 2px;border-bottom:1px solid var(--line);font-size:14px}.check input{width:19px;height:19px;accent-color:var(--green)}.done{text-decoration:line-through;color:#9aa59d}.muted{color:var(--muted);font-size:12px;line-height:1.7}.bottom{position:fixed;bottom:0;left:0;right:0;background:#ffffffed;backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:center;gap:6px;padding:9px 8px calc(9px + env(safe-area-inset-bottom))}.bottom button{border:0;background:transparent;padding:8px 14px;color:var(--muted);border-radius:12px}.bottom button.active{background:var(--pale);color:var(--green);font-weight:700}.btn{background:var(--green);color:white;border:0;border-radius:12px;padding:11px 14px;font-weight:650}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.notice{background:#fff8e8;border:1px solid #f1e3c3;padding:12px;border-radius:12px;font-size:13px;line-height:1.6}
</style></head><body><header class="top"><small>简单做饭 · 规律吃饭 · 认真生活</small><h1>一周好好吃饭</h1><p id="updated">菜单加载中…</p></header><main class="wrap">
<nav class="tabs" id="days"></nav>
<section class="section active" id="menu"></section><section class="section" id="shop"><div class="row"><h2>采购清单</h2><button class="btn" id="reset">重置勾选</button></div><p class="muted">按每两天采购一次整理；鸡蛋、大米、燕麦、面粉、油和调味料作为常备库存。</p><div id="shopping"></div></section>
<section class="section" id="guide"><h2>每日三餐搭配</h2><div class="card"><b>早餐</b><p id="breakfast"></p><b>午餐</b><p id="lunch"></p><b>晚餐</b><p id="dinner"></p></div><h2>备餐与食品安全</h2><div class="notice" id="safety"></div><h2>更新说明</h2><p class="muted">应用会在联网打开时检查托管端的 recipes.json。将新菜单文件替换到网站后，应用下次联网打开即可读取。当前版本尚未连接自动生成食谱的云端服务，因此不会自行生成新菜单。</p><button class="btn" id="refresh">重新读取菜单</button></section>
</main><nav class="bottom"><button class="active" data-page="menu">本周菜单</button><button data-page="shop">采购清单</button><button data-page="guide">备餐指南</button></nav>
<script>
let data = null;
let day = 0;

let checked = {};
try {
  checked = JSON.parse(localStorage.getItem('checkedItems') || '{}');
} catch(e) {
  checked = {};
}

function safe(value) {
  return String(value ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  })[c]);
}

async function load() {
  const updated = document.getElementById('updated');

  try {
    updated.textContent = '正在更新菜单...';

    const response = await fetch('./recipes.json', {
      cache: 'no-store'
    });

    if (!response.ok) {
      throw new Error('菜单文件读取失败');
    }

    const result = await response.json();

    if (
      !Array.isArray(result.recipes) ||
      result.recipes.length !== 7 ||
      !result.meals
    ) {
      throw new Error('食谱数据格式不正确');
    }

    result.recipes.forEach(item => {
      if (
        !item.day ||
        !item.name ||
        !Array.isArray(item.ingredients) ||
        !Array.isArray(item.steps)
      ) {
        throw new Error('食谱内容不完整');
      }
    });

    data = result;
    day = Math.min(day, data.recipes.length - 1);

    render();

    updated.textContent =
      (data.week || '本周菜单') +
      ' · 更新于 ' + (data.updated || '未知');

  } catch(error) {
    console.error(error);
    updated.textContent =
      '菜单读取失败，请检查网络或 recipes.json 文件';
  }
}

function render() {
  document.getElementById('days').innerHTML =
    data.recipes.map((x, i) =>
      `<button class="tab ${i === day ? 'active' : ''}"
      data-day="${i}">${safe(x.day)}</button>`
    ).join('');

  document.querySelectorAll('[data-day]').forEach(btn => {
    btn.onclick = () => {
      day = Number(btn.dataset.day);
      renderMenu();
    };
  });

  document.getElementById('breakfast').textContent =
    data.meals.breakfast || '';

  document.getElementById('lunch').textContent =
    data.meals.lunch || '';

  document.getElementById('dinner').textContent =
    data.meals.dinner || '';

  document.getElementById('safety').innerHTML =
    (data.notes || []).map(x => safe(x)).join('<br>');

  renderMenu();
  renderShop();
}

function renderMenu() {
  const x = data.recipes[day];

  document.querySelectorAll('[data-day]').forEach(btn => {
    btn.classList.toggle(
      'active',
      Number(btn.dataset.day) === day
    );
  });

  document.getElementById('menu').innerHTML = `
    <div class="card">
      <div class="day">${safe(x.day)} · 今日主菜</div>

      <div class="dish">${safe(x.name)}</div>

      <div class="tag">${safe(x.tag || '')}</div>

      <div class="grid" style="margin-top:14px">
        <div class="mini">
          <b>约3份</b>一次烹饪
        </div>
        <div class="mini">
          <b>按需调整</b>主食与早餐
        </div>
      </div>

      <h2>食材用量</h2>

      <ul>
        ${x.ingredients.map(i =>
          `<li>${safe(i)}</li>`
        ).join('')}
      </ul>

      <h2>烹饪步骤</h2>

      <ol>
        ${x.steps.map(s =>
          `<li>${safe(s)}</li>`
        ).join('')}
      </ol>
    </div>
  `;
}

function renderShop() {
  const groups = [
    ['周一、周二', 0, 2],
    ['周三、周四', 2, 4],
    ['周五、周六', 4, 6],
    ['周日', 6, 7]
  ];

  document.getElementById('shopping').innerHTML =
    groups.map(([title, a, b]) => {

      const items = [
        ...new Set(
          data.recipes
            .slice(a, b)
            .flatMap(x => x.buy || [])
        )
      ];

      return `
        <div class="card">
          <b>${title}</b>

          ${items.map(v => {
            const key = title + '|' + v;

            return `
              <label class="check">
                <input type="checkbox"
                  data-key="${safe(encodeURIComponent(key))}"
                  ${checked[key] ? 'checked' : ''}>

                <span class="${checked[key] ? 'done' : ''}">
                  ${safe(v)}
                </span>
              </label>
            `;
          }).join('')}
        </div>
      `;
    }).join('');

  document.querySelectorAll('#shopping input').forEach(el => {
    el.onchange = () => {
      const key = decodeURIComponent(el.dataset.key);

      checked[key] = el.checked;

      localStorage.setItem(
        'checkedItems',
        JSON.stringify(checked)
      );

      el.nextElementSibling.classList.toggle(
        'done',
        el.checked
      );
    };
  });
}

document.querySelectorAll('.bottom button').forEach(btn => {
  btn.onclick = () => {

    document.querySelectorAll('.bottom button')
      .forEach(x => x.classList.toggle('active', x === btn));

    document.querySelectorAll('.section')
      .forEach(section =>
        section.classList.toggle(
          'active',
          section.id === btn.dataset.page
        )
      );
  };
});

document.getElementById('reset').onclick = () => {
  localStorage.removeItem('checkedItems');
  checked = {};
  renderShop();
};

document.getElementById('refresh').onclick = load;

if ('serviceWorker' in navigator) {
  window.addEventListener('load', async () => {
    try {
      const registration =
        await navigator.serviceWorker.register('./sw.js');

      registration.update();
    } catch(error) {
      console.error('离线缓存注册失败：', error);
    }
  });
}

load();
</script></body></html>
